<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Greenside Edge app icon concept: a golf flag on a green, in the
       brand palette. Export to PNG at 1024x1024 (icon.png),
       1024x1024 centered w/ padding (adaptive-icon.png), and a
       1284x2778 splash. See apps/mobile/assets/README.md. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a1c"/>
      <stop offset="1" stop-color="#071f12"/>
    </linearGradient>
    <radialGradient id="green" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#39c46d"/>
      <stop offset="1" stop-color="#1d6e3c"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- putting green -->
  <ellipse cx="512" cy="650" rx="300" ry="120" fill="url(#green)" opacity="0.95"/>
  <!-- hole -->
  <ellipse cx="560" cy="650" rx="34" ry="15" fill="#06160d"/>
  <!-- flag pole -->
  <rect x="552" y="330" width="14" height="320" rx="7" fill="#e8efe9"/>
  <!-- flag -->
  <path d="M566 340 L740 386 L566 432 Z" fill="#39c46d"/>
  <!-- ball -->
  <circle cx="430" cy="652" r="26" fill="#e8efe9"/>
</svg>
