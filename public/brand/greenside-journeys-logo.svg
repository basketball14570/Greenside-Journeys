<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Golf Flag Icon -->
  <g transform="translate(120, 100)">
    <!-- Flagpole -->
    <rect x="48" y="10" width="4" height="180" fill="#0f766e" filter="url(#shadow)"/>
    
    <!-- Flag -->
    <path d="M 52 10 L 120 30 L 120 70 L 52 50 Z" fill="url(#flagGradient)" filter="url(#shadow)"/>
    
    <!-- Golf ball on green -->
    <ellipse cx="50" cy="200" rx="35" ry="8" fill="#15803d" opacity="0.6"/>
    <circle cx="50" cy="192" r="12" fill="white" filter="url(#shadow)"/>
    <circle cx="47" cy="190" r="1.5" fill="#d1d5db"/>
    <circle cx="53" cy="190" r="1.5" fill="#d1d5db"/>
    <circle cx="50" cy="194" r="1.5" fill="#d1d5db"/>
    <circle cx="47" cy="194" r="1.5" fill="#d1d5db"/>
    <circle cx="53" cy="194" r="1.5" fill="#d1d5db"/>
  </g>
  
  <!-- Company Name -->
  <text x="250" y="140" font-family="'Georgia', serif" font-size="64" font-weight="bold" fill="#0f766e">
    Greenside
  </text>
  
  <text x="250" y="200" font-family="'Georgia', serif" font-size="64" font-weight="bold" fill="#15803d">
    Journeys
  </text>
  
  <!-- Tagline -->
  <text x="250" y="240" font-family="'Arial', sans-serif" font-size="18" font-style="italic" fill="#4b5563">
    The Insider's Guide to Tournament Golf Travel
  </text>
  
  <!-- Decorative Golf Tee -->
  <g transform="translate(680, 160)">
    <path d="M 0 0 L -3 40 L 3 40 Z" fill="#0f766e"/>
    <circle cx="0" cy="-5" r="8" fill="white" filter="url(#shadow)"/>
    <circle cx="-2" cy="-6" r="1" fill="#d1d5db"/>
    <circle cx="2" cy="-6" r="1" fill="#d1d5db"/>
    <circle cx="0" cy="-3" r="1" fill="#d1d5db"/>
  </g>
</svg>
