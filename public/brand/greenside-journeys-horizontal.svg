<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Golf Flag Icon -->
  <g transform="translate(30, 20)">
    <!-- Flagpole -->
    <rect x="28" y="5" width="3" height="80" fill="#0f766e"/>
    
    <!-- Flag -->
    <path d="M 31 5 L 65 15 L 65 35 L 31 25 Z" fill="url(#flagGradient)" filter="url(#shadow)"/>
    
    <!-- Green -->
    <ellipse cx="30" cy="92" rx="25" ry="5" fill="#15803d" opacity="0.6"/>
    
    <!-- Golf ball -->
    <circle cx="30" cy="88" r="7" fill="white" filter="url(#shadow)"/>
    <circle cx="28.5" cy="87" r="1" fill="#d1d5db"/>
    <circle cx="31.5" cy="87" r="1" fill="#d1d5db"/>
    <circle cx="30" cy="89.5" r="1" fill="#d1d5db"/>
  </g>
  
  <!-- Company Name -->
  <text x="120" y="55" font-family="'Georgia', serif" font-size="42" font-weight="bold" fill="#0f766e">
    Greenside Journeys
  </text>
  
  <!-- Tagline -->
  <text x="120" y="80" font-family="'Arial', sans-serif" font-size="14" font-style="italic" fill="#6b7280">
    The Insider's Guide to Tournament Golf Travel
  </text>
  
  <!-- Decorative element - small golf tee -->
  <g transform="translate(570, 50)">
    <path d="M 0 0 L -2 20 L 2 20 Z" fill="#0f766e"/>
    <circle cx="0" cy="-3" r="4" fill="white" filter="url(#shadow)"/>
  </g>
</svg>
