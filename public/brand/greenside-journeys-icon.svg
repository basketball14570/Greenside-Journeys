<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- Golf Flag -->
  <g transform="translate(100, 40)">
    <!-- Flagpole -->
    <rect x="-2" y="0" width="4" height="90" fill="white"/>
    
    <!-- Flag -->
    <path d="M 2 5 L 40 15 L 40 35 L 2 25 Z" fill="url(#flagGradient)" filter="url(#shadow)"/>
    
    <!-- Green -->
    <ellipse cx="0" cy="100" rx="50" ry="12" fill="#064e3b" opacity="0.5"/>
    <ellipse cx="0" cy="98" rx="40" ry="8" fill="#15803d"/>
    
    <!-- Golf ball -->
    <circle cx="0" cy="92" r="10" fill="white" filter="url(#shadow)"/>
    <circle cx="-2" cy="91" r="1.2" fill="#d1d5db"/>
    <circle cx="2" cy="91" r="1.2" fill="#d1d5db"/>
    <circle cx="0" cy="94" r="1.2" fill="#d1d5db"/>
    <circle cx="-3" cy="94" r="1.2" fill="#d1d5db"/>
    <circle cx="3" cy="94" r="1.2" fill="#d1d5db"/>
  </g>
  
  <!-- Letter F and J in elegant script -->
  <text x="100" y="165" font-family="'Georgia', serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    FJ
  </text>
</svg>
